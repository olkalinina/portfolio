# Cloudflare Pages configuration. Contains no secrets: the code-hashing key is a Cloudflare secret (CODE_PEPPER).
name = "portfolio"
compatibility_date = "2026-10-01"
pages_build_output_dir = "."

[[d1_databases]]
binding = "DB"
database_name = "portfolio-access"
database_id = "c34cf406-e452-4af8-9665-4df44171176e"

# Private storage for NDA case-study text and images. Not reachable from the internet: only the server code reads it.
[[kv_namespaces]]
binding = "CONTENT"
id = "22e8475b9a2843e898ec9055ccf274d6"

# Cloudflare Access protects /admin and /api/admin; these identify your Access application and login.
# Empty means "admin not set up yet", and the admin stays closed. None of these are secrets.
[vars]
ACCESS_TEAM_DOMAIN = "calm-unit-28aa.cloudflareaccess.com"
ACCESS_AUD = "c72a3a265483ab30417d75d324b3a4ef337931cd2993fa1caceec1a553178f36" # comma-separated list of Access application tags
ADMIN_EMAIL = "sundary.for@gmail.com"
